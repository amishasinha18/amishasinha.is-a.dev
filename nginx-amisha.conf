# Amisha portfolio — static SPA served from the Vite build output.
# Install: see the commands printed after this file.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Domain pointed at this server via DuckDNS. default_server also catches
    # the bare IP, so both http://amishasinha.duckdns.org and the IP work.
    server_name amishasinha.duckdns.org;

    root /opt/amisha/dist;
    index index.html;

    # ---- compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/javascript application/json
        image/svg+xml application/manifest+json;

    # ---- hashed build assets: safe to cache forever ------------------------
    # Filenames carry a content hash (index-BKdcRPSL.js), so a new deploy = a
    # new name. `=404` (not the SPA fallback) so a missing JS never returns
    # HTML, which would break with a MIME error.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- images / PDFs (certificates, project photos): medium cache --------
    location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico|pdf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- index.html: never cache, so redeploys are picked up immediately ---
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # ---- SPA fallback: every unknown path serves the app shell -------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- light hardening ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\.(?!well-known) {
        deny all;
    }
}
